<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">A small sequence of measured observations</title>
  <desc id="desc">Five vertical marks rise gradually along a horizontal baseline.</desc>
  <rect width="960" height="560" fill="#f3f1eb"/>
  <path d="M96 438H864" stroke="#9da39f" stroke-width="2"/>
  <g fill="#176b58">
    <rect x="142" y="346" width="64" height="92"/>
    <rect x="294" y="300" width="64" height="138"/>
    <rect x="446" y="255" width="64" height="183"/>
    <rect x="598" y="210" width="64" height="228"/>
    <rect x="750" y="154" width="64" height="284"/>
  </g>
  <g fill="#606964" font-family="system-ui, sans-serif" font-size="22">
    <text x="96" y="82">observations / fixture</text>
    <text x="142" y="482">01</text><text x="294" y="482">02</text><text x="446" y="482">03</text>
    <text x="598" y="482">04</text><text x="750" y="482">05</text>
