id: smdd_002_P22303_0
name: Pharmacophore_AChE
description: 'You are given a protein receptor structure (receptor.pdb). The binding
    pocket center is located at coordinates (120.838921, 104.555725, -112.742851)
    in Angstroms with a pocket radius of 12 Angstroms. Your task is to identify the
    3 most conserved pharmacophoric interaction points within this binding pocket.
    Each point should be specified by its 3D coordinates (x, y, z) and one interaction
    type. The valid interaction types are: Donor, Acceptor, Aromatic, Hydrophobic,
    Cation, Anion. Output a CSV file titled ''solution.csv'' with columns x,y,z,type
    containing exactly 3 rows (no header).'
pocket_center:
- 120.83892059326172
- 104.55572509765625
- -112.74285125732422
input_files:
- receptor.pdb
output_config:
    file_path: solution.csv
    format: csv
evaluation:
-   name: 3D Pharmacophore Match
    module: metrics.pharmacophore_3d
    function: evaluate_3d_pharmacophore
    result_key: score
    inputs:
    -   source: output
        arg: agent_solution_path
    -   source: file
        value: ground_truth.json
        arg: ground_truth_path
    condition:
        eq: 1.0
